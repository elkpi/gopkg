name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check code formatting (gofmt)
        run: |
          diffs=$(gofmt -s -l .)
          if [ -n "$diffs" ]; then
            echo "The following files are not formatted properly:"
            echo "$diffs"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  test:
    name: Test with Race Detector
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests with race detection
        run: go test -v -race -count=1 ./...

  cross-compile:
    name: Cross-Platform Build Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Linux (All packages)
        run: GOOS=linux go build -v ./...

      - name: Build Darwin (Cross-platform packages)
        run: GOOS=darwin go build -v ./net/qos/... ./net/portmapper/... ./security/securelog/...

      - name: Build Windows (Cross-platform packages)
        run: GOOS=windows go build -v ./net/qos/... ./net/portmapper/... ./security/securelog/...
